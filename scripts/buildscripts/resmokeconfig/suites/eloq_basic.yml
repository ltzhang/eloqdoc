test_kind: js_test

selector:
  roots:
  - tests/jstests/eloq_basic/*.js
  - tests/jstests/eloq_basic/**/*.js
executor:
  archive:
    hooks:
      - ValidateCollections
  config:
    shell_options:
      readMode: commands
      eval: load("tests/jstests/libs/override_methods/detect_spawning_own_mongod.js");
  hooks:
  - class: ValidateCollections
    shell_options:
      global_vars:
        TestData:
          skipValidationOnNamespaceNotFound: false
  - class: CleanEveryN
    n: 20
  fixture:
    class: MongoDFixture
    mongod_options:
      storageEngine: eloq
      set_parameters:
        enableTestCommands: 1
